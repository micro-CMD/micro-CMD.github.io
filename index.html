<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
<div class="container">
    <!-- ========== 导航栏 ========== -->
    <nav class="nav">
        <div class="logo">📝 我的博客</div>
        <div class="nav-links">
            <a href="/" onclick="navigate('/'); return false;">首页</a>
            <a href="/about" onclick="navigate('/about'); return false;">关于</a>
            <!-- 下载入口已移除，通过直接访问 #/arcaea-download 或 #/phira-download 进入 -->
            <a onclick="toggleTheme(); return false;" style="cursor:pointer;">🌓 深色</a>
        </div>
    </nav>

    <!-- ========== 首页文章列表 ========== -->
    <div id="home-page"></div>

    <div id="download-page" style="display:none;">
        <div id="download-content" style="padding:20px 0;"></div>
    </div>

    <!-- ========== 文章详情页 ========== -->
    <div id="post-page" style="display:none;">
        <div id="post-content"></div>
        <!-- 分享按钮区域 -->
        <div id="share-section" style="margin-top: 30px; text-align: center; display: none;">
            <button id="share-btn" style="
                background: #4a6cf7;
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 30px;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 4px 12px rgba(74,108,247,0.3);
                transition: 0.2s;
            ">📤 生成分享图</button>
        </div>
        <a class="back-link" onclick="navigate('/'); return false;">← 返回首页</a>
    </div>

    <!-- ========== 下载页面容器（Arcaea 和 Phira 共用） ========== -->
    <div id="download-page" style="display:none;">
        <div id="download-content" style="padding: 20px 0;"></div>
    </div>

    <!-- ========== 页脚 ========== -->
    <div class="footer">© 2026 我的博客 · 用 ❤️ 和 HTML 搭建</div>
</div>

<script src="app.js"></script>
</body>
</html>
